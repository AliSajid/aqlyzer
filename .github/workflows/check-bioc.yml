## R CMD check + BiocCheck via the neurogenomics/rworkflows reusable action.
## https://github.com/neurogenomics/rworkflows
##
## Replaces the biocthis workflow that generated its OS/R/Bioc matrix on the
## fly. The matrix is now stated explicitly below so it is obvious exactly
## which R and Bioconductor versions run, and so that Bioconductor *devel*
## (with R *devel*) is always exercised — the release-only setup missed it.
##
## aqlyzer has a Rust (extendr) backend, so a Rust toolchain is installed
## before the action runs. The package's src/Makevars looks for cargo in
## ~/.cargo/bin, which is where rustup installs it.

## 'on' is quoted so YAML does not read it as the boolean TRUE.
'on':
  push:
    branches: [main, master, devel, 'RELEASE_**']
  pull_request:
    branches: [main, master, devel, 'RELEASE_**']

name: R-CMD-check-bioc

jobs:
  rworkflows:
    permissions: write-all
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }} / Bioc ${{ matrix.config.bioc }})
    container: ${{ matrix.config.cont }}
    strategy:
      fail-fast: false
      matrix:
        config:
          ## Bioconductor devel on R devel — the target for new submissions.
          - { os: ubuntu-latest, r: 'devel',  bioc: 'devel',   cont: 'bioconductor/bioconductor_docker:devel' }
          ## Bioconductor release on its associated R release.
          - { os: ubuntu-latest, r: 'release', bioc: 'release', cont: 'bioconductor/bioconductor_docker:RELEASE_3_23' }
          ## Cross-platform coverage on the current release.
          - { os: macOS-latest,   r: 'release', bioc: 'release' }
          - { os: windows-latest, r: 'release', bioc: 'release' }
    steps:
      ## Rust toolchain for the extendr backend (>= 1.65 per Cargo.toml).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: neurogenomics/rworkflows@master
        with:
          run_rcmdcheck: true
          as_cran: true
          run_bioccheck: true
          run_vignettes: true
          has_testthat: true
          run_lintr: true
          ## The repo spell-checks with `typos` (see hk.pkl), not the R
          ## `spelling` package, so skip the action's spelling step.
          run_spelling: false
          run_covr: false
          run_pkgdown: false
          has_runit: false
          has_latex: false
          run_docker: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          runner_os: ${{ runner.os }}
          cache_version: cache-v1
          ncpus: 2
